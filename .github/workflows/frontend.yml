name: Production quality

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/m8-staging]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://daify:daify@localhost:5432/daify_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: node --test scripts/*.test.mjs
      - run: npm run typecheck
      - run: npm run prisma:validate --workspace @daify/api
      - run: npm run build
      - name: Package and inspect the Netlify app without deployment credentials
        run: |
          npx --no-install netlify build --offline --context production --filter @daify/web
          node scripts/check-netlify-artifact.mjs
        env:
          NODE_ENV: production
          DAIFY_API_URL: https://api.example.test
          DAIFY_WEB_ORIGIN: https://staging.example.test
          DAIFY_CLIENT_IP_HEADER: x-nf-client-connection-ip
          # Synthetic canary only: fail if it appears in public build output.
          PROXY_SIGNING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          NETLIFY_TELEMETRY_DISABLED: '1'

  playwright:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://daify:daify@localhost:5432/daify_test?schema=public
      TEST_DATABASE_URL: postgresql://daify:daify@localhost:5432/daify_test?schema=public
      NODE_ENV: test
      ANALYTICS_TEST_REDIS_URL: redis://localhost:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daify_test
          POSTGRES_USER: daify
          POSTGRES_PASSWORD: daify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daify -d daify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:migrate:deploy --workspace @daify/api
      - run: npm run staging:db:test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test
        env:
          WEB_TEST_PRODUCTION: 'true'
