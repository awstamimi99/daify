name: Production quality

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, Milestone-1]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://daify:daify@localhost:5432/daify_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: node --test scripts/*.test.mjs
      - run: npm run typecheck
      - run: npm run prisma:validate --workspace @daify/api
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://daify:daify@localhost:5432/daify_test?schema=public
      TEST_DATABASE_URL: postgresql://daify:daify@localhost:5432/daify_test?schema=public
      NODE_ENV: test
      ANALYTICS_TEST_REDIS_URL: redis://localhost:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daify_test
          POSTGRES_USER: daify
          POSTGRES_PASSWORD: daify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daify -d daify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:migrate:deploy --workspace @daify/api
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test
        env:
          WEB_TEST_PRODUCTION: 'true'
