<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MenuFlow Brand Preview</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--mf-ivory);color:var(--mf-ink);font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:48px 24px 72px}.hero{padding:70px 0 45px;border-bottom:1px solid var(--mf-stone)}.logo{width:min(100%,620px)}.tag{font-size:22px;color:#5c625c;margin:24px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:30px 0}.swatch{min-height:150px;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}.swatch span{font-size:13px;opacity:.72}.dark{background:var(--mf-ink);padding:54px 32px;border-radius:28px;margin-top:30px}.dark img{width:min(100%,560px)}h2{margin-top:52px}
  </style>
</head>
<body><main class="wrap"><section class="hero"><img class="logo" src="../assets/icons/menuflow-logo.svg" alt="MenuFlow logo"><p class="tag">Beautiful menus, made to flow.</p></section><h2>Core palette</h2><div class="grid"><div class="swatch" style="background:#171A17;color:white"><b>Ink</b><span>#171A17</span></div><div class="swatch" style="background:#F7F4ED"><b>Warm Ivory</b><span>#F7F4ED</span></div><div class="swatch" style="background:#7C8B73;color:white"><b>Sage</b><span>#7C8B73</span></div><div class="swatch" style="background:#C8A96B"><b>Champagne</b><span>#C8A96B</span></div></div><h2>Dark usage</h2><div class="dark"><img src="../assets/icons/menuflow-logo-dark.svg" alt="MenuFlow reversed logo"></div></main></body>
</html>
