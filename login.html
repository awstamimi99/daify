<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log In — MenuFlow</title><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <meta
      name="description"
      content="Log in to MenuFlow. Prototype interface only."
    />
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-art">
        <a class="brand" href="index.html" aria-label="MenuFlow home"><img class="brand-logo" src="assets/icons/menuflow-logo-dark.svg" alt="MenuFlow"></a>
        <div>
          <span class="eyebrow">Made for hospitality</span>
          <p class="quote" style="max-width: 620px">
            Your menu, as considered as everything you serve.
          </p>
        </div>
        <small>Oliva · Fictional demo restaurant</small>
      </section>
      <section class="auth-panel">
        <a
          class="brand"
          href="index.html"
          style="position: absolute; top: 1.5rem; left: 1.5rem"
          aria-label="MenuFlow home"><img class="brand-logo" src="assets/icons/menuflow-logo.svg" alt="MenuFlow"></a>
        <div class="auth-box">
          <span class="eyebrow">Welcome back</span>
          <h1 class="h2">Log in to MenuFlow.</h1>
          <p>
            Prototype interface only. No credentials are transmitted or stored.
          </p>
          <form
            class="form"
            data-prototype="login"
            novalidate
            style="padding: 0; box-shadow: none; background: transparent"
          >
            <div class="field">
              <label for="email">Email</label
              ><input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                /><button class="password-toggle" type="button">Show</button>
              </div>
            </div>
            <div style="display: flex; justify-content: flex-end">
              <a class="small-link" href="#">Forgot password?</a>
            </div>
            <button class="btn btn--dark" type="submit">Log In</button>
            <div class="form-message" role="status"></div>
          </form>
          <p class="center" style="font-size: 0.85rem">
            Don't have an account?
            <a class="small-link" href="signup.html">Start Free Trial</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
