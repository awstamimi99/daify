<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MenuFlow Template Customizer</title>
    <meta
      name="description"
      content="Live development customizer for MenuFlow restaurant menu templates."
    />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/customizer.css" />
    <script src="assets/js/menu/templates-config.js" defer></script>
    <script src="assets/js/menu/customizer.js" defer></script>
  </head>
  <body class="customizer-page">
    <aside class="customizer-panel">
      <header class="customizer-brand">
        <a href="templates.html" aria-label="Back to templates"
          ><img src="assets/icons/menuflow-logo.svg" alt="MenuFlow" /></a
        ><span>Template Studio</span>
      </header>
      <div class="customizer-scroll">
        <div class="customizer-group">
          <label for="templateSelect">Template</label
          ><select id="templateSelect"></select>
        </div>
        <div class="customizer-group">
          <label for="presetSelect">Style preset</label
          ><select id="presetSelect"></select>
        </div>
        <div class="customizer-group">
          <label for="languageSelect">Preview language</label
          ><select id="languageSelect">
            <option value="en">English · LTR</option>
            <option value="ar">العربية · RTL</option>
          </select>
        </div>
        <fieldset class="customizer-group">
          <legend>Colors</legend>
          <div class="color-grid">
            <label
              >Background<input type="color" data-theme="background" /></label
            ><label>Primary<input type="color" data-theme="primary" /></label
            ><label>Accent<input type="color" data-theme="accent" /></label
            ><label>Card<input type="color" data-theme="surface" /></label
            ><label>Text<input type="color" data-theme="text" /></label>
          </div>
        </fieldset>
        <fieldset class="customizer-group" data-capability="buttonShape">
          <legend>Button shape</legend>
          <div class="option-row" data-options="buttonShape"></div>
        </fieldset>
        <fieldset class="customizer-group" data-capability="cardShape">
          <legend>Card shape</legend>
          <div class="option-row" data-options="cardShape"></div>
        </fieldset>
        <fieldset class="customizer-group" data-capability="cardStyle">
          <legend>Card style</legend>
          <div class="option-row" data-options="cardStyle"></div>
        </fieldset>
        <fieldset class="customizer-group" data-capability="itemLayout">
          <legend>Item layout</legend>
          <div class="option-row" data-options="itemLayout"></div>
        </fieldset>
        <fieldset class="customizer-group" data-capability="sectionNav">
          <legend>Section navigation</legend>
          <div class="option-row" data-options="sectionNav"></div>
        </fieldset>
        <fieldset class="customizer-group" data-capability="imageStyle">
          <legend>Image style</legend>
          <div class="option-row" data-options="imageStyle"></div>
        </fieldset>
      </div>
    </aside>
    <main class="customizer-workspace">
      <header class="workspace-toolbar">
        <div>
          <strong id="workspaceTitle">Atelier</strong
          ><span>Live Oliva preview</span>
        </div>
        <div class="device-switcher" aria-label="Preview size">
          <button data-device="desktop" class="active">Desktop</button
          ><button data-device="tablet">Tablet</button
          ><button data-device="mobile">Mobile</button>
        </div>
        <a
          id="openTemplate"
          href="templates/atelier.html?preview=1"
          target="_blank"
          >Open preview ↗</a
        >
      </header>
      <div class="preview-canvas" data-device="desktop">
        <iframe
          id="menuPreview"
          title="Live restaurant menu preview"
          src="templates/atelier.html?embed=1"
        ></iframe>
      </div>
    </main>
  </body>
</html>
