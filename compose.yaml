services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: daify
      POSTGRES_USER: daify
      POSTGRES_PASSWORD: daify
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daify -d daify"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - daify-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  daify-postgres:
